name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install
          uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict src

      - name: Pytest
        run: uv run pytest -q

      # T078: action.yml and the workflows must match GitHub's published schemas.
      - name: Validate action.yml and workflows
        run: |
          uvx --from check-jsonschema==0.39.0 check-jsonschema \
            --builtin-schema vendor.github-actions action.yml
          uvx --from check-jsonschema==0.39.0 check-jsonschema \
            --builtin-schema vendor.github-workflows .github/workflows/*.yml

  # T074: run the harness on fixtures with known outcomes (PASS / AGENT_FAIL /
  # INFRA_ERROR); a misclassification fails CI.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python + deps
        run: |
          uv python install
          uv sync --locked --all-extras --dev

      - name: Harness self-check
        run: uv run lgcov selfcheck
