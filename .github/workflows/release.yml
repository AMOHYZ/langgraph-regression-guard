# T084: tag vX.Y.Z -> build wheel/sdist, GitHub Release, publish to TestPyPI (OIDC).
# Run by hand with dry_run (the default): build, check the wheel runs, upload dist/; no
# release, nothing published. Release and publish only ever run for a v*.*.* tag.
name: release

on:
  push:
    tags:
      - "v*.*.*"  # release versions only; the moving v0 Action tag must not publish
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload the wheel and sdist only; release and publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel installs and runs
        run: |
          uv venv --python 3.12 smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/lgcov --version

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lgcov/
    permissions:
      id-token: write  # trusted publishing (OIDC); no API token
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
