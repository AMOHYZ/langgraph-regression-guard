name: lgcov two jobs

on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          phase: candidate

  # T179: this PR's action.yml, since the base's has no `phase` yet. Once it does, the report job in
  # graph-diff.yml moves to this layout with this job on the base, and this file goes. No
  # pull-requests: write, so it leaves the report's comment alone and uses the job summary.
  evaluate:
    needs: candidate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          phase: evaluate
