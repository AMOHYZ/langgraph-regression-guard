name: lgcov regression guard
description: >-
  Replay a LangGraph agent's recorded cassettes on every PR, post one report comment
  (updated in place) with root vs propagated drift per node, and gate on fail-on.
author: AMOHYZ

inputs:
  graph-entrypoint:
    description: "<file.py>:<attr> of the compiled graph. Empty: graph_entrypoint from lgcov.yaml."
    required: false
    default: ""
  cassette-dir:
    description: "Directory with baseline.json. Empty: cassette_dir from lgcov.yaml, else cassettes."
    required: false
    default: ""
  taxonomy:
    description: "taxonomy.yaml to validate. Empty skips L2; judges don't run in the Action yet."
    required: false
    default: ""
  fail-on:
    description: "root-drift | any-drift | never: exit 1 when this kind of drift is found."
    required: false
    default: root-drift
  python-version:
    description: "Python version uv installs and runs."
    required: false
    default: "3.12"
  github-token:
    description: "Token for the PR comment. Read-only on forks: the report then goes to the job summary."
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: "Markdown report written by this run."
    value: ${{ steps.lgcov.outputs.report-path }}
  root-drift-count:
    description: "Nodes that were the first to drift in some run."
    value: ${{ steps.lgcov.outputs.root-drift-count }}
  propagated-drift-count:
    description: "Nodes that drifted only after an earlier node in the same run."
    value: ${{ steps.lgcov.outputs.propagated-drift-count }}
  verdict:
    description: "pass | fail | error (error: harness error, not a regression)."
    value: ${{ steps.lgcov.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Check fail-on
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON" in
          root-drift|any-drift|never) ;;
          *)
            echo "::error title=lgcov::fail-on must be one of root-drift, any-drift, never; got '$FAIL_ON'"
            exit 2
            ;;
        esac

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install your project and lgcov
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        UV_PYTHON: ${{ inputs.python-version }}
      run: |
        # Actions runs bash with -e; this step checks exit codes itself.
        set +e -uo pipefail
        log="$RUNNER_TEMP/lgcov-install.log"
        {
          if [ -f uv.lock ]; then
            uv sync --locked
          elif [ -f requirements.txt ]; then
            uv venv && uv pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            uv venv && uv pip install -e .
          else
            uv venv
          fi && uv pip install "$ACTION_PATH"
        } >"$log" 2>&1
        status=$?
        cat "$log"
        if [ "$status" -ne 0 ]; then
          {
            echo "harness-error<<LGCOV_EOF"
            echo "Installing your project or lgcov failed (exit $status):"
            tail -n 20 "$log"
            echo "LGCOV_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Check out the base commit
      id: base
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -z "$BASE_SHA" ]; then
          echo "lgcov: not a pull_request event; the graph diff is skipped"
          exit 0
        fi
        dir="$RUNNER_TEMP/lgcov-base"
        if { git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
             || git fetch --no-tags --depth=1 origin "$BASE_SHA"; } \
           && git worktree add --detach "$dir" "$BASE_SHA"; then
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
        else
          echo "::warning title=lgcov::could not check out the base commit; the graph diff is skipped"
        fi

    - name: Run lgcov
      id: lgcov
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        UV_PYTHON: ${{ inputs.python-version }}
        GRAPH: ${{ inputs.graph-entrypoint }}
        CASSETTE_DIR: ${{ inputs.cassette-dir }}
        TAXONOMY: ${{ inputs.taxonomy }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASE_DIR: ${{ steps.base.outputs.dir }}
        HARNESS_ERROR: ${{ steps.install.outputs.harness-error }}
      run: |
        # Actions runs bash with -e; this step checks exit codes itself.
        set +e -uo pipefail
        report="$RUNNER_TEMP/lgcov/report.md"
        args=(ci --report "$report" --github-output "$GITHUB_OUTPUT" --fail-on "$FAIL_ON")
        [ -n "$GRAPH" ] && args+=(--graph "$GRAPH")
        [ -n "$CASSETTE_DIR" ] && args+=(--cassette-dir "$CASSETTE_DIR")
        [ -n "$TAXONOMY" ] && args+=(--taxonomy "$TAXONOMY")
        [ -n "$BASE_DIR" ] && args+=(--base-dir "$BASE_DIR")
        if [ -n "$HARNESS_ERROR" ]; then
          # The project didn't install; lgcov alone is enough to render the harness report.
          uvx --from "$ACTION_PATH" lgcov "${args[@]}" --harness-error "$HARNESS_ERROR"
        else
          .venv/bin/lgcov "${args[@]}"
        fi
        code=$?
        if [ ! -s "$report" ]; then
          mkdir -p "$(dirname "$report")"
          printf '%s\n' "<!-- lgcov-report -->" "## ⚠️ lgcov: harness error, not a regression" "" \
            "⚠️ Harness error, not a regression: lgcov could not start (exit $code)." > "$report"
          printf '%s\n' "report-path=$report" "root-drift-count=0" "propagated-drift-count=0" \
            "verdict=error" "exit-code=2" >> "$GITHUB_OUTPUT"
        fi

    - name: Post or update the PR comment
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.lgcov.outputs.report-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const MARKER = '<!-- lgcov-report -->';
          const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
          const toSummary = async (why) => {
            core.warning(`lgcov: ${why}; the report is in the job summary instead.`);
            await core.summary.addRaw(body).write();
          };
          const pr = context.payload.pull_request;
          if (!pr) {
            await toSummary('not a pull_request event');
            return;
          }
          try {
            let login = 'github-actions[bot]';
            try {
              login = (await github.rest.users.getAuthenticated()).data.login;
            } catch {
              // The default GITHUB_TOKEN can't read its own user; it posts as github-actions[bot].
            }
            const issue = { ...context.repo, issue_number: pr.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const mine = comments.find((c) => c.user?.login === login && c.body?.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
          } catch (err) {
            await toSummary(
              `could not post the PR comment (${err.status ?? 'error'}: ${err.message}); ` +
                'PRs from forks get a read-only token',
            );
          }

    - name: Exit with the verdict
      shell: bash
      env:
        CODE: ${{ steps.lgcov.outputs.exit-code }}
        VERDICT: ${{ steps.lgcov.outputs.verdict }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "lgcov: verdict $VERDICT (fail-on: $FAIL_ON), exit ${CODE:-2}"
        exit "${CODE:-2}"
