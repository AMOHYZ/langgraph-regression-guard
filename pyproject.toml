[project]
name = "lgcov"
version = "0.2.0"
description = "Catch silent regressions in LangGraph agents on every PR. lgcov re-runs only the nodes a PR can reach and shows which node's output changed first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ahmed Mohy" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.4.7",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/AMOHYZ/langgraph-regression-guard"
Repository = "https://github.com/AMOHYZ/langgraph-regression-guard"
Issues = "https://github.com/AMOHYZ/langgraph-regression-guard/issues"

[project.scripts]
graph-diff = "lgcov.cli:main"
lgcov = "lgcov.cli:lgcov_main"

[build-system]
requires = ["uv_build>=0.8.13,<1.0.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lgcov"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
mypy_path = ["src", "tests"]
strict = true
explicit_package_bases = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: runs real per-side processes; CI runs these, `-m \"not slow\"` skips them locally",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
