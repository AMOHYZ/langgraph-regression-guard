# T264 content checks for the fan-out agent (requirement + format tags).
# judge: code only. Harm is relative (pass on base → fail on PR).
version: 1
system: fanout
failure_modes:
  - id: worker_part_missing
    description: The reducer summary drops a worker part or the join separators.
  - id: worker_b_tone_drift
    description: Worker b no longer emits the plain tone marker in its part.
kpis:
  # tag: requirement
  - name: summary_has_worker_a
    tag: requirement
    failure_mode: worker_part_missing
    node: reducer
    judge: code
    description: The summary still includes worker a's part.
    rubric: Does reducer output contain "a:"?
    check:
      type: output_contains
      text: "a:"

  # tag: requirement
  - name: summary_has_worker_b_plain
    tag: requirement
    failure_mode: worker_b_tone_drift
    node: reducer
    judge: code
    description: The summary still includes worker b's plain tone marker.
    rubric: Does reducer output contain "b:plain:"?
    check:
      type: output_contains
      text: "b:plain:"

  # tag: requirement
  - name: summary_has_worker_c
    tag: requirement
    failure_mode: worker_part_missing
    node: reducer
    judge: code
    description: The summary still includes worker c's part.
    rubric: Does reducer output contain "c:"?
    check:
      type: output_contains
      text: "c:"

  # tag: format
  - name: summary_joins_all_parts
    tag: format
    failure_mode: worker_part_missing
    node: reducer
    judge: code
    description: "The summary still joins a, b:plain, and c with the pipe separators."
    rubric: "Does reducer output match the a | b:plain | c join shape?"
    check:
      type: output_matches
      pattern: "a:.+ \\| b:plain:.+ \\| c:.+"

  # tag: requirement
  - name: worker_b_emits_plain
    tag: requirement
    failure_mode: worker_b_tone_drift
    node: worker_b
    judge: code
    description: Worker b itself still emits the plain tone marker.
    rubric: Does worker_b output contain "b:plain:"?
    check:
      type: output_contains
      text: "b:plain:"
