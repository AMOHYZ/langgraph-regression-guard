# Blind requirement checks for the subgraph agent (T262 measure).
# Path policy only (judge: code). Top-level node names only (sub, not sub.inner).
# No fake content judges.
version: 1
system: subgraph_agent
failure_modes:
  - id: preprocess_skipped
    description: before never runs, so the question is never normalized into the subgraph.
  - id: no_subgraph
    description: The subgraph node never ran.
kpis:
  - name: before_runs
    failure_mode: preprocess_skipped
    node: before
    judge: code
    description: Every run normalizes the question before the subgraph.
    rubric: Did the run visit before?
    check: {type: node_visited, node: before}

  - name: sub_runs
    failure_mode: no_subgraph
    node: sub
    judge: code
    description: The subgraph container still runs (top-level name seen by harm path).
    rubric: Did the run visit sub?
    check: {type: node_visited, node: sub}
