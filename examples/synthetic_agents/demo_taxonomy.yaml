# Blind requirement checks for the demo support agent (T262 measure).
# Path policy only (judge: code). No fake content judges.
# Harm is relative (pass on base → fail on PR): class-specific checks may fail
# on a correct base for the other question kind without false-flagging.
version: 1
system: demo_agent
failure_modes:
  - id: classify_skipped
    description: classify never runs, so order vs hours routing never happens.
  - id: skipped_order_lookup
    description: An order question never visits lookup_order, so status is never fetched.
  - id: wrong_hours_lookup
    description: A non-order (hours) question incorrectly visits lookup_order.
kpis:
  - name: classify_runs
    failure_mode: classify_skipped
    node: classify
    judge: code
    description: Every run classifies before routing.
    rubric: Did the run visit classify?
    check: {type: node_visited, node: classify}

  - name: order_lookup_runs
    failure_mode: skipped_order_lookup
    node: lookup_order
    judge: code
    description: Order questions fetch status via lookup_order (hours fail this on a correct base; only a new miss blocks).
    rubric: Did the run visit lookup_order?
    check: {type: node_visited, node: lookup_order}

  - name: hours_skips_lookup
    failure_mode: wrong_hours_lookup
    node: lookup_order
    judge: code
    description: Hours questions must not call the order tool (order questions fail this on a correct base; only a new hit blocks).
    rubric: Did the run avoid lookup_order?
    check: {type: node_not_visited, node: lookup_order}

  - name: order_path_sequence
    failure_mode: skipped_order_lookup
    node: respond
    judge: code
    description: Order path is classify → lookup_order → respond (others may intervene).
    rubric: Did classify, lookup_order, then respond appear in that order?
    check: {type: node_sequence, nodes: [classify, lookup_order, respond]}
