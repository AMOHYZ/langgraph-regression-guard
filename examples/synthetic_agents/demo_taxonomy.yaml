# T264 content checks for the demo support agent (requirement + format tags).
# judge: code only. Harm is relative (pass on base → fail on PR).
version: 1
system: demo
failure_modes:
  - id: order_tool_lost
    description: lookup_order no longer returns the shipped status for an order question.
  - id: respond_drops_context
    description: respond drops order status, the question echo, or the support prompt tail.
kpis:
  # tag: requirement
  - name: lookup_order_shipped
    tag: requirement
    failure_mode: order_tool_lost
    node: lookup_order
    judge: code
    description: Order lookup still returns the shipped status string.
    rubric: 'Does lookup_order output contain "order #42: shipped"?'
    check:
      type: output_contains
      text: "order #42: shipped"
      when:
        input_contains: order

  # tag: requirement
  - name: respond_includes_shipped
    tag: requirement
    failure_mode: respond_drops_context
    node: respond
    judge: code
    description: The answer still states that the order shipped.
    rubric: Does respond output contain shipped?
    check:
      type: output_contains
      text: shipped
      when:
        input_contains: order

  # tag: format
  - name: respond_echoes_order_question
    tag: format
    failure_mode: respond_drops_context
    node: respond
    judge: code
    description: Respond still echoes the exact order-question fixture string.
    rubric: Does respond output contain "Where is my order?"?
    check:
      type: output_contains
      text: "Where is my order?"
      when:
        input_contains: order

  # tag: format
  - name: respond_echoes_hours_question
    tag: format
    failure_mode: respond_drops_context
    node: respond
    judge: code
    description: Respond still echoes the exact hours-question fixture string.
    rubric: Does respond output contain "What are your hours?"?
    check:
      type: output_contains
      text: "What are your hours?"
      when:
        input_contains: hours

  # tag: format
  - name: respond_keeps_support_prompt_tail
    tag: format
    failure_mode: respond_drops_context
    node: respond
    judge: code
    description: Respond still carries the support-agent prompt-tail artifact.
    rubric: Does respond output contain "support agent"?
    check:
      type: output_contains
      text: "support agent"
      when:
        input_contains: hours
