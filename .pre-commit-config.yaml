repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
    - id: mypy
      name: mypy
      entry: uv run mypy --strict src tests
      language: system
      types: [python]
      pass_filenames: false
    # T116: docs/banned-phrases.txt nowhere in the repo; the README has why-us.md's tagline.
    - id: docs-lint
      name: docs lint
      entry: uv run python -m lgcov.docs_lint
      language: system
      pass_filenames: false
      always_run: true
