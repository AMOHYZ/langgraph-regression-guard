# repo, set `repo:` to the clone (relative to this file) and set the API keys.
#
# Node names: a node inside the research_supervisor subgraph is research_supervisor.<node>.
# supervisor_tools runs researcher_subgraph once per ConductResearch call, so the
# researchers' nodes are named under it: research_supervisor.supervisor_tools.<node>.
#
# Evidence: `at` is the first + line of the quote on head_ref (6532a41); - lines are the
# base_ref (f95d200) lines they replace. The diff checked is whitespace-blind (`-w`), so
# Ruff's reformatting doesn't count as a change.
